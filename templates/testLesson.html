<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Practice</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/simple-keyboard@3.7.60/build/css/index.css"
  />

  <style>
    body {
      background: #f7f7f7;
      text-align: center;
      padding: 40px;
      font-family: Arial, sans-serif;
      /* Add padding to bottom so content isn't hidden behind keyboard */
      padding-bottom: 250px; 
    }

    h1 {
      margin-bottom: 10px;
    }

    #textToType {
      font-size: 22px;
      max-width: 700px;
      margin: 20px auto;
      line-height: 1.5;
    }

    #typedOutput {
      font-size: 22px;
      margin: 20px auto;
      max-width: 700px;
      min-height: 60px;
      border: 2px solid #ccc;
      padding: 15px;
      background: white;
    }

    .correct {
      color: green;
    }

    .incorrect {
      color: red;
      text-decoration: underline;
    }

    /* FIXED: Keyboard wrapper is now responsive, not scaled */
    .keyboard-wrapper {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #e8e8e8; /* Visual container for the keyboard */
      padding: 20px 0;
      border-top: 1px solid #ccc;
      display: flex;
      justify-content: center;
      z-index: 1000;
    }

    .simple-keyboard {
      max-width: 850px;
      width: 95%; /* Leaves a little margin on small screens */
    }

    .simple-keyboard .hg-button {
      font-size: 18px;
      height: 50px; /* Slightly taller for easier clicking */
      line-height: 50px;
      margin: 3px;
    }

    /* Active/Pressed State */
    .hg-button.hg-activeButton {
      background: #007bff !important;
      color: white !important;
    }

    /* Highlight style for the next expected key */
    .hg-button.hg-highlight {
      background: #ffcc00 !important;
      color: black !important;
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
      transform: scale(1.05);
      font-weight: bold;
      border: 2px solid #e6b800;
      z-index: 10;
    }
  </style>
</head>

<body>
  <h1>Typing Practice</h1>
  <p>Type the text below. Follow the <b>yellow highlighted key</b> on the keyboard!</p>

  <div id="textToType">
    The quick brown fox jumps over the lazy dog.
  </div>

  <div id="typedOutput"></div>

  <div class="keyboard-wrapper">
    <div class="simple-keyboard"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@3.7.60/build/index.js"></script>

  <script>
  const targetText = document.getElementById("textToType").innerText;
  const typedOutput = document.getElementById("typedOutput");

  let typed = "";

  // Initialize Keyboard
  const Keyboard = window.SimpleKeyboard.default;
  const keyboard = new Keyboard({
    onKeyPress: key => {
      handleVirtualKey(key);
    },
    // Highlighting only. We removed 'physicalKeyboardHighlightPress' 
    // to prevent the double-input conflict.
    physicalKeyboardHighlight: true, 
    layout: {
      default: [
        "` 1 2 3 4 5 6 7 8 9 0 - = {bksp}",
        "{tab} q w e r t y u i o p [ ] \\",
        "{lock} a s d f g h j k l ; ' {enter}",
        "{shift} z x c v b n m , . / {shift}",
        "{space}"
      ]
    }
  });

  function updateHighlighting() {
    let resultHTML = "";
    for (let i = 0; i < typed.length; i++) {
      resultHTML += (typed[i] === targetText[i])
        ? `<span class="correct">${typed[i]}</span>`
        : `<span class="incorrect">${typed[i]}</span>`;
    }
    resultHTML += `<span style="color:#bbb;">${targetText.slice(typed.length)}</span>`;
    typedOutput.innerHTML = resultHTML;
  }

  function highlightNextKey() {
    // 1. Clear existing highlights
    keyboard.setOptions({
      buttonTheme: [] 
    });

    // 2. Check if finished
    if (typed.length >= targetText.length) return;

    // 3. Get the next character needed
    const nextChar = targetText[typed.length];
    let keyToHighlight = nextChar.toLowerCase();

    // 4. Map special characters to keyboard keys
    if (nextChar === " ") {
      keyToHighlight = "{space}";
    } 
    
    // 5. Apply the highlight class
    keyboard.setOptions({
      buttonTheme: [
        {
          class: "hg-highlight",
          buttons: keyToHighlight
        }
      ]
    });
  }

  // Logic for Virtual Keyboard Clicks
  function handleVirtualKey(key) {
    if (key === "{bksp}") {
      typed = typed.slice(0, -1);
    } else if (key === "{space}") {
      typed += " ";
    } else if (!key.startsWith("{")) {
      typed += key;
    }
    
    updateHighlighting();
    highlightNextKey();
  }

  // Logic for Physical Keyboard Presses
  document.addEventListener("keydown", e => {
    // Prevent default browser actions for these keys to stop page scrolling/navigation
    if (e.key === " " || e.key === "Backspace" || e.key === "Enter" || e.key.length === 1) {
       // We allow shortcuts (like Ctrl+R) to pass through
       if (!e.ctrlKey && !e.metaKey && !e.altKey) {
         e.preventDefault();
       }
    }

    if (e.key === "Backspace") {
      typed = typed.slice(0, -1);
    } else if (e.key === "Enter") {
      // Handle enter if needed
    } else if (e.key.length === 1) {
      typed += e.key;
    }

    updateHighlighting();
    highlightNextKey();
  });

  // Initial highlight on load
  highlightNextKey();
  updateHighlighting();

</script>
</body>
</html>
