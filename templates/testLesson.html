<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typing Practice</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>">
 
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-keyboard@3.7.60/build/css/index.css" />

  <style>
    :root {
      --primary: #0984e3;
      --success: #00b894;
      --error: #d63031;
      --bg-gradient: linear-gradient(180deg, #81ecec 0%, #74b9ff 100%);
      
      /* Keyboard Colors */
      --kb-bg: #2d3436;      
      --key-bg: #f5f6fa;     
      --key-shadow: #b2bec3; 
      --key-text: #2d3436;   
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-gradient);
      font-family: 'Nunito', sans-serif;
      color: #2d3436;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden; 
    }

    /* --- NAVIGATION --- */
    .btn-back {
      position: absolute;
      top: 15px;
      left: 15px;
      background: white;
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
      z-index: 500; 
      border: 2px solid white;
    }
    .btn-back:hover {
      transform: scale(1.05);
      background: #f0f9ff;
    }

    /* --- LAYOUT STRUCTURE --- */
    .top-section {
      flex: 0 0 auto;
      padding-top: 15px;
      text-align: center;
      position: relative; 
    }

    .game-wrapper {
      flex: 1; 
      display: flex;
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      padding: 10px 20px;
      overflow: hidden; 
    }

    .keyboard-section {
      flex: 0 0 auto; 
      background: var(--kb-bg); 
      padding: 15px 0; 
      border-top: 6px solid #0984e3; 
      width: 100%;
      display: flex;
      justify-content: center;
      box-shadow: 0 -10px 20px rgba(0,0,0,0.2);
      z-index: 100;
    }

    /* --- VISUALS --- */
    h1 { 
        margin: 0; 
        font-size: 2.2rem; 
        font-weight: 900; 
        color: white; 
        text-shadow: 0 3px 0 rgba(0,0,0,0.15); 
    }
    
    h2 { 
        margin: 5px 0 10px; 
        font-size: 1.1rem; 
        color: #0984e3; 
        background: white;
        display: inline-block;
        padding: 5px 20px;
        border-radius: 20px;
        font-weight: 800;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    .drill-indicator {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.9);
      font-weight: 700;
      margin-bottom: 5px;
    }

    .stats-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .progress-track {
      width: 350px;
      max-width: 90%;
      height: 12px;
      background: rgba(0,0,0,0.15); 
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.4);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #fdcb6e; 
      background-image: linear-gradient(45deg,rgba(255,255,255,.15) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.15) 75%,transparent 75%,transparent);
      background-size: 1rem 1rem;
      transition: width 0.2s ease;
    }

    .streak-pill {
      background: white;
      padding: 6px 20px;
      border-radius: 20px;
      font-weight: 900;
      color: var(--primary);
      box-shadow: 0 3px 0 rgba(0,0,0,0.1);
      font-size: 1rem;
    }
    .streak-active {
      color: #e17055;
      transform: scale(1.1);
    }

    /* --- GAME BOX --- */
    .typing-container {
      background: white;
      width: 100%;
      max-width: 800px;
      height: 100%; 
      max-height: 380px; 
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 8px solid rgba(255,255,255,0.5);
      background-clip: padding-box;
      overflow: hidden; 
      transition: border-color 0.2s;
    }

    .shake {
      animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
      border-color: var(--error) !important;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }

    #fingerHint {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 15px;
      height: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #textDisplay {
      font-size: 28px;
      line-height: 1.5;
      font-family: 'Courier New', Courier, monospace;
      letter-spacing: 1px;
      color: #b2bec3;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      white-space: pre-wrap; 
      max-width: 95%;
    }

    .correct { color: var(--success); }
    .incorrect { color: var(--error); text-decoration: underline; background: #ffe6e6; }
    .active-char { 
        display: inline-block;
        color: #2d3436; 
        border-bottom: 4px solid #fdcb6e; 
        min-width: 12px; 
    }

    /* --- MODALS --- */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px; 
      z-index: 50;
      text-align: center;
      overflow-y: auto;
    }

    #introDesc { max-width: 90%; margin: 10px auto 25px; font-size: 1.2rem; line-height: 1.5; color: #636e72; }
    #introTitle { font-size: 2rem; color: #2d3436; font-weight: 900; margin-bottom: 5px; }

    .key-icon {
        display: inline-block;
        background: white;
        border: 2px solid #ccc;
        border-radius: 5px;
        padding: 0 6px;
        font-family: monospace;
        font-weight: bold;
        color: #333;
        box-shadow: 0 3px 0 #bbb;
        margin: 0 3px;
    }

    .btn-action {
      background: var(--success);
      color: white;
      border: none;
      padding: 12px 40px;
      font-size: 1.4rem;
      border-radius: 50px;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      box-shadow: 0 5px 0 #008f72; 
      transition: transform 0.1s;
    }
    .btn-action:hover { transform: translateY(-3px); filter: brightness(1.1); box-shadow: 0 8px 0 #008f72; }
    .btn-action:active { transform: translateY(5px); box-shadow: 0 0 0; }

    .hint-text {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #888;
      font-weight: 700;
    }

    /* --- KEYBOARD --- */
    .simple-keyboard { 
        max-width: 850px; 
        width: 98%; 
        background-color: transparent !important; 
    }
    
    .simple-keyboard .hg-button { 
        height: 45px; 
        border-radius: 8px; 
        font-weight: 800; 
        background: var(--key-bg);
        box-shadow: 0 4px 0 var(--key-shadow);
        border-bottom: none; 
        color: var(--key-text);
        margin: 2px !important;
        font-size: 1rem;
    }
    
    .simple-keyboard .hg-button:active, 
    .simple-keyboard .hg-activeButton {
        transform: translateY(4px);
        box-shadow: 0 0 0 var(--key-shadow) !important;
    }

    .hg-button.hg-home-row { 
        background: #dfe6e9 !important; 
        border: 2px dashed #b2bec3; 
        box-shadow: 0 4px 0 #b2bec3 !important;
    }
    .hg-button.hg-highlight {
      background: #fdcb6e !important;
      color: #2d3436 !important;
      box-shadow: 0 4px 0 #e1b12c !important;
      border: none !important;
    }

    /* Small Screen Tweaks */
    @media(max-height: 650px) {
        h1 { font-size: 1.5rem; }
        .typing-container { padding: 10px; max-height: 250px; }
        .btn-action { padding: 8px 25px; font-size: 1.1rem; }
        .simple-keyboard .hg-button { height: 35px; }
        .btn-back { top: 10px; left: 10px; padding: 5px 12px; font-size: 0.8rem; }
    }
    
    /* Tiny Screen Scroll Mode */
    @media(max-height: 500px) {
        body { overflow: auto; display: block; }
        .top-section { padding: 10px; }
        .game-wrapper { display: block; padding: 10px; overflow: visible; }
        .typing-container { height: auto; min-height: 250px; margin-bottom: 20px; }
        .keyboard-section { position: relative; }
    }
  </style>
</head>

<body>

  <a href="/levels" class="btn-back">← Map</a>

  <div class="top-section">
    <h1 id="levelTitle">Level 1</h1>
    <h2 id="levelDesc">...</h2>
    <div id="drillCount" class="drill-indicator">Drill 1/3</div>
    
    <div class="stats-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="streak-pill" id="streakBox">Streak: <span id="streakDisplay">0</span></div>
    </div>
  </div>

  <div class="game-wrapper">
    <div class="typing-container" id="gameBox">
      
      <div id="fingerHint"></div>
      <div id="textDisplay"></div>
      
      <div id="introModal" class="modal-overlay">
          <div id="introTitle">Ready?</div>
          <div id="introDesc">...</div>
          <button class="btn-action" onclick="startLevel()">Start</button>
          <div class="hint-text">(or press Space)</div>
      </div>

      <div id="successModal" class="modal-overlay" style="display: none;">
        <h3 id="successTitle" style="color: #00b894; margin-bottom: 10px; font-size: 2.2rem; font-weight:900;">🎉 Amazing!</h3>
        <p style="font-size: 1.2rem; color:#666; margin-bottom:25px; font-weight:700;">Great job!</p>
        <button id="successBtn" class="btn-action" onclick="handleSuccessAction()">Next</button>
        <div class="hint-text">(or press Space)</div>
      </div>

    </div>
  </div>

  <div class="keyboard-section">
    <div class="simple-keyboard"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/simple-keyboard@3.7.60/build/index.js"></script>

  <script>
    const levels = [
      {
        title: "Level 1: The Anchors",
        desc: "Index Fingers on F and J",
        instruction: "Feel for the bumps on <span class='key-icon'>F</span> and <span class='key-icon'>J</span>.<br>Use your <b>Index Fingers</b> only.",
        segments: [
            "ffff jjjj ff jj",
            "fjfj jfjf jffj fjjf",
            "fff jjj fff jjj"
        ]
      },
      {
        title: "Level 2: Middle Fingers",
        desc: "Add Middle Fingers (D & K)",
        instruction: "Keep Index on bumps.<br>Place <b>Middle Fingers</b> on <span class='key-icon'>D</span> and <span class='key-icon'>K</span>.",
        segments: [
            "dddd kkkk dkdk kdkd",
            "dfd fjdk kdjf jkj",
            "fdfd jkjk ddkk kkdd"
        ]
      },
      {
        title: "Level 3: Ring Fingers",
        desc: "Add Ring Fingers (S & L)",
        instruction: "Place <b>Ring Fingers</b> on <span class='key-icon'>S</span> and <span class='key-icon'>L</span>.",
        segments: [
            "ssss llll slsl lsls",
            "sss lll slkf jlsd",
            "sldk fjsl lsks ksls"
        ]
      },
      {
        title: "Level 4: Pinky Fingers",
        desc: "Add Pinky Fingers (A & ;)",
        instruction: "Place <b>Pinky Fingers</b> on <span class='key-icon'>A</span> and <span class='key-icon'>;</span>.",
        segments: [
            "aaaa ;;;; a;a; ;a;a",
            "asdf jkl; ask dad",
            "salad all fall; flask;"
        ]
      },
      {
        title: "Level 5: Home Row Mix",
        desc: "All Fingers Together",
        instruction: "Don't look at your hands!<br>Use all 8 fingers.",
        segments: [
            "flask dad salad fall;",
            "a sad lad asks a dad;",
            "all lads fall; asdf jkl;"
        ]
      }
    ];

    const fingerMap = {
        'a': 'Left Pinky', 'q': 'Left Pinky', 'z': 'Left Pinky',
        's': 'Left Ring',  'w': 'Left Ring',  'x': 'Left Ring',
        'd': 'Left Middle','e': 'Left Middle','c': 'Left Middle',
        'f': 'Left Index', 'r': 'Left Index', 'v': 'Left Index', 't': 'Left Index', 'g': 'Left Index', 'b': 'Left Index',
        'j': 'Right Index','u': 'Right Index','m': 'Right Index', 'y': 'Right Index', 'h': 'Right Index', 'n': 'Right Index',
        'k': 'Right Middle','i': 'Right Middle',',': 'Right Middle',
        'l': 'Right Ring', 'o': 'Right Ring', '.': 'Right Ring',
        ';': 'Right Pinky', 'p': 'Right Pinky', '/': 'Right Pinky',
        ' ': 'Thumb'
    };

    let currentLevelIdx = 0;
    let currentSegmentIdx = 0;
    let targetText = "";
    let typed = "";
    let levelState = "intro"; // intro, playing, drill_complete, level_finished
    let streak = 0;
    let mistakes = 0;

    const Keyboard = window.SimpleKeyboard.default;
    const keyboard = new Keyboard({
      onKeyPress: key => handleInput(key),
      physicalKeyboardHighlight: true,
      layout: {
        default: [
          "` 1 2 3 4 5 6 7 8 9 0 - = {bksp}",
          "{tab} q w e r t y u i o p [ ] \\",
          "{lock} a s d f g h j k l ; ' {enter}",
          "{shift} z x c v b n m , . / {shift}",
          "{space}"
        ]
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const levelParam = urlParams.get('level');
    currentLevelIdx = levelParam ? parseInt(levelParam) : 0;
    loadLevel(currentLevelIdx);

    function loadLevel(index) {
      if (index >= levels.length) {
        window.location.href = "/levels";
        return;
      }
      const level = levels[index];
      currentLevelIdx = index;
      currentSegmentIdx = 0;
      
      setupSegment();

      document.getElementById('levelTitle').textContent = level.title;
      document.getElementById('levelDesc').textContent = level.desc;
      document.getElementById('introTitle').textContent = level.title;
      document.getElementById('introDesc').innerHTML = level.instruction;
      
      levelState = "intro";
      document.getElementById('introModal').style.display = "flex";
      document.getElementById('successModal').style.display = "none";
      document.getElementById('streakDisplay').textContent = "0";
      document.getElementById('streakBox').classList.remove('streak-active');
      document.getElementById('gameBox').classList.remove('shake');
      
      keyboard.setOptions({
          buttonTheme: [{ class: "hg-home-row", buttons: "a s d f j k l ;" }]
      });
    }

    function setupSegment() {
        const level = levels[currentLevelIdx];
        targetText = level.segments[currentSegmentIdx];
        typed = "";
        streak = 0;
        mistakes = 0;
        
        document.getElementById('drillCount').textContent = `Part ${currentSegmentIdx + 1}/${level.segments.length}`;
        document.getElementById('progressBar').style.width = "0%";
        renderText();
    }

    function startLevel() {
        levelState = "playing";
        document.getElementById('introModal').style.display = "none";
        renderText();
        updateFingerHint();
        highlightNextKey();
    }

    function renderText() {
      const displayDiv = document.getElementById('textDisplay');
      let html = "";
      for (let i = 0; i < targetText.length; i++) {
        const char = targetText[i];
        if (i < typed.length) {
          const isCorrect = typed[i] === char;
          html += `<span class="${isCorrect ? 'correct' : 'incorrect'}">${char}</span>`;
        } else if (i === typed.length) {
          html += `<span class="active-char">${char}</span>`;
        } else {
          html += `<span>${char}</span>`;
        }
      }
      displayDiv.innerHTML = html;
    }

    function updateFingerHint() {
        const nextChar = targetText[typed.length];
        if (!nextChar) {
            document.getElementById('fingerHint').textContent = "";
            return;
        }
        const finger = fingerMap[nextChar.toLowerCase()] || "";
        document.getElementById('fingerHint').textContent = finger;
    }

    function highlightNextKey() {
      const nextChar = targetText[typed.length];
      if (!nextChar) return;
      let keyToHighlight = nextChar.toLowerCase();
      if (nextChar === " ") keyToHighlight = "{space}";
      keyboard.setOptions({
        buttonTheme: [
            { class: "hg-home-row", buttons: "a s d f j k l ;" },
            { class: "hg-highlight", buttons: keyToHighlight }
        ]
      });
    }

    function updateUI() {
        renderText();
        updateFingerHint();
        highlightNextKey();
        const pct = (typed.length / targetText.length) * 100;
        document.getElementById('progressBar').style.width = pct + "%";
        
        const sEl = document.getElementById('streakDisplay');
        const sBox = document.getElementById('streakBox');
        sEl.textContent = streak;
        if (streak > 5) sBox.classList.add('streak-active');
        else sBox.classList.remove('streak-active');
    }

    function handleInput(key) {
        if (levelState !== "playing") {
             const isStartKey = (key === "Enter" || key === "{enter}" || key === " " || key === "{space}");
             
             if (isStartKey) {
                 if (levelState === "intro") startLevel();
                 else if (levelState === "drill_complete" || levelState === "level_finished") handleSuccessAction();
             }
             return;
        }

        let char = key;
        if (key === "{space}") char = " ";
        if (key === "{bksp}" || key === "Backspace") {
            if (typed.length > 0) {
                typed = typed.slice(0, -1);
                streak = 0;
            }
            updateUI();
            return;
        }
        
        if (char.length > 1) return; 

        const expected = targetText[typed.length];
        const box = document.getElementById('gameBox');

        if (char === expected) {
            typed += char;
            streak++;
            box.classList.remove('shake');
        } else {
            streak = 0;
            mistakes++;
            box.classList.remove('shake');
            void box.offsetWidth; 
            box.classList.add('shake');
        }

        updateUI();
        checkCompletion();
    }

    function checkCompletion() {
        if (typed.length === targetText.length) {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            
            const level = levels[currentLevelIdx];
            const isLastSegment = (currentSegmentIdx + 1) >= level.segments.length;
            
            const modal = document.getElementById('successModal');
            const title = document.getElementById('successTitle');
            const btn = document.getElementById('successBtn');
            
            modal.style.display = "flex";
            keyboard.setOptions({ buttonTheme: [] });

            if (isLastSegment) {
                levelState = "level_finished";
                title.textContent = "🎉 Level Complete!";
                btn.textContent = "Back to Map";
                
                const currentMax = localStorage.getItem('typingFun_maxLevel') || 0;
                if (currentLevelIdx >= parseInt(currentMax)) {
                    localStorage.setItem('typingFun_maxLevel', currentLevelIdx + 1);
                }
            } else {
                levelState = "drill_complete";
                title.textContent = "Amazing!!";
                btn.textContent = "Next";
            }
        }
    }

    function handleSuccessAction() {
        if (levelState === "drill_complete") {
            currentSegmentIdx++;
            setupSegment();
            levelState = "playing";
            document.getElementById('successModal').style.display = "none";
            renderText();
            updateFingerHint();
            highlightNextKey();
        } else if (levelState === "level_finished") {
            window.location.href = "/levels";
        }
    }

    document.addEventListener("keydown", e => {
        if(e.key === " " || e.key === "Backspace") e.preventDefault();
        handleInput(e.key);
    });

  </script>
</body>
</html>
