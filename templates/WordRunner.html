<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Word Runner</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    /* Visual Upgrades (CSS) */
    body { margin: 0; background: #e0f2fe; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
    #wrap { max-width: 820px; margin: 0 auto; padding: 10px; position: relative; }
    
    #btnHome {
      display: inline-block;
      margin-bottom: 10px;
      text-decoration: none;
      color: #0f172a;
      font-weight: bold;
      font-size: 0.9rem;
      border: 1px solid #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      background: white;
      transition: all 0.2s;
      box-shadow: 0 2px 0 #cbd5e1;
    }
    #btnHome:hover { background: #f1f5f9; transform: translateY(-1px); }
    #btnHome:active { transform: translateY(1px); box-shadow: none; }

    #hud { 
        margin-bottom: 10px; 
        display: flex; 
        justify-content: space-between; 
        align-items: flex-end; 
        gap: 1rem; 
        background: #fff;
        padding: 10px 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    #wordBox { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace; font-size: 1.4rem; font-weight: 600; color: #334155; }
    .ok { color: #16a34a; }
    .cursor { opacity: .5; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    
    #badgeShift { 
        font-size: .65rem; 
        background: #ef4444; 
        color: white; 
        padding: 2px 6px; 
        border-radius: 4px; 
        vertical-align: middle;
        margin-left: 8px;
        font-family: system-ui;
        font-weight: bold;
        letter-spacing: 0.5px;
    }
    /* Fixed min-height to prevent layout jumping */
    #status { font-size: .8rem; color: #64748b; margin-top: 4px; font-weight: normal; font-family: system-ui; min-height: 1.2rem; }
    #stats { font-size: 1.2rem; font-weight: bold; color: #0f172a; font-variant-numeric: tabular-nums; }
    
    /* Original Canvas Dimensions preserved, just bordered differently */
    canvas { 
        border: 4px solid #334155; 
        background: #87CEEB; 
        display: block; 
        border-radius: 4px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }
    
    #modalOverlay {
      display: none;
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #modalContent {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      border: 1px solid #e2e8f0;
    }
    h2 { margin-top: 0; color: #0f172a; }
    input { padding: 10px; border: 2px solid #e2e8f0; border-radius: 6px; width: 65%; margin-bottom: 15px; font-size: 1rem; outline: none; }
    input:focus { border-color: #3b82f6; }
    
    button {
      padding: 10px 20px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button:hover { background: #15803d; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    
    #leaderboard { margin-top: 20px; text-align: left; border-top: 1px solid #f1f5f9; padding-top: 15px; }
    #scoresList { max-height: 200px; overflow-y: auto; padding-right: 5px; }
    #scoresList::-webkit-scrollbar { width: 6px; }
    #scoresList::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
    #scoresList::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    .score-row { display: flex; justify-content: space-between; font-size: 0.95rem; padding: 8px 6px; border-bottom: 1px solid #f8fafc; color: #334155; }
    .score-row:nth-child(1) { color: #d97706; font-weight: bold; }
    .score-row:nth-child(2) { color: #64748b; font-weight: bold; }
    .score-row:nth-child(3) { color: #b45309; font-weight: bold; }
    .rank { font-weight: bold; width: 30px; opacity: 0.7; }
    .pname { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 10px; }
    .pscore { font-family: monospace; font-weight: bold; min-width: 50px; text-align: right; }

    #connectionStatus { font-size: 0.75rem; color: #ef4444; margin-top: 15px; font-weight: 600; }
    .config-alert {
        background: #fff3cd; color: #856404; padding: 10px; border: 1px solid #ffeeba; 
        border-radius: 4px; font-size: 0.8rem; margin-bottom: 10px; display: none;
    }
  </style>
</head>
<body>
<div id="wrap">
  <a href="/" id="btnHome">← Main Menu</a>

  <div id="hud">
    <div id="wordBox">
      word: <span id="word"></span>
      <span id="badgeShift" style="display:none;">(HOLD SHIFT)</span>
      <div id="status"></div>
    </div>
    <div id="stats">score: <span id="score">0</span></div>
  </div>
  <div id="msg" style="font-size: 0.8rem; color: #666; margin-bottom: 4px;">Type → wait → Space/Enter to jump. Press R to restart.</div>
  
  <div class="config-alert" id="configAlert">
    <b>Setup Required:</b> To enable the global leaderboard, open this file in a text editor and paste your Firebase Config keys where marked.
  </div>

  <div style="position: relative;">
    <canvas id="game" width="800" height="200"></canvas>
    
    <div id="modalOverlay">
      <div id="modalContent">
        <h2>Game Over!</h2>
        <p>Your Score: <span id="finalScore">0</span></p>
        
        <div id="submitSection">
          <input type="text" id="playerName" placeholder="Enter your name" maxlength="12">
          <button id="btnSubmit">Submit Score</button>
        </div>
        
        <div id="leaderboard">
          <h3 id="lbTitle" style="margin: 0 0 10px 0;">Top Runners</h3>
          <div id="scoresList">Loading...</div>
        </div>
        
        <p id="connectionStatus"></p>
        <p style="font-size: 0.8rem; margin-top: 15px; color: #666;">Press <b>R</b> to restart</p>
      </div>
    </div>
  </div>
</div>

<!-- Firebase & Game Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  // ==========================================
  //  STEP 1: CONFIGURATION
  // ==========================================
  
  let firebaseConfig;
  let useInternalAuth = false;
  
  if (typeof __firebase_config !== 'undefined') {
    firebaseConfig = JSON.parse(__firebase_config);
    useInternalAuth = true;
  } else {
    firebaseConfig = {
      apiKey: "AIzaSyB_lN5Iwj73OE4b3Ae3xnaACHrqnFO0N7k",
      authDomain: "wordrunner-bc696.firebaseapp.com",
      projectId: "wordrunner-bc696",
      storageBucket: "wordrunner-bc696.firebasestorage.app",
      messagingSenderId: "936139248664",
      appId: "1:936139248664:web:4075f0159bcb93c0ccdf6d"
    };
  }

  // ==========================================
  //  End Configuration
  // ==========================================

  let app, auth, db, appId;
  let currentUser = null;
  let isGlobalMode = false;

  async function initSystem() {
    try {
      if (!firebaseConfig || firebaseConfig.apiKey === "REPLACE_WITH_YOUR_API_KEY") {
        throw new Error("Config not set");
      }

      app = initializeApp(firebaseConfig);
      auth = getAuth(app);
      db = getFirestore(app);
      appId = (typeof __app_id !== 'undefined') ? __app_id : 'word-runner-global';
      
      if (useInternalAuth && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
        await signInWithCustomToken(auth, __initial_auth_token);
      } else {
        await signInAnonymously(auth);
      }

      onAuthStateChanged(auth, (user) => {
        currentUser = user;
        if (user) {
          isGlobalMode = true;
          setupGlobalLeaderboard();
          updateConnectionStatus("Connected to Global Leaderboard", "#16a34a");
        }
      });

    } catch (e) {
      console.warn("Global Mode Failed:", e.message);
      isGlobalMode = false;
      setupLocalLeaderboard();
      
      if (e.message === "Config not set") {
        document.getElementById('configAlert').style.display = 'block';
        updateConnectionStatus("Offline Mode (Edit file to enable Global)", "#d9534f");
      } else {
        const errorMsg = e.code ? e.code : e.message;
        updateConnectionStatus(`Offline Mode (Error: ${errorMsg})`, "#d9534f");
      }
    }
  }

  function updateConnectionStatus(msg, color) {
    const el = document.getElementById('connectionStatus');
    el.textContent = msg;
    if(color) el.style.color = color;
    const title = document.getElementById('lbTitle');
    title.textContent = isGlobalMode ? "Global Top Runners" : "Local Top Runners";
  }

  function setupGlobalLeaderboard() {
    const collName = 'leaderboard';
    const path = useInternalAuth 
        ? collection(db, 'artifacts', appId, 'public', 'data', collName)
        : collection(db, 'scores');

    onSnapshot(path, (snapshot) => {
      const scores = [];
      snapshot.forEach(doc => scores.push(doc.data()));
      scores.sort((a, b) => b.score - a.score);
      renderLeaderboard(scores.slice(0, 10));
    }, (err) => {
      console.error("Leaderboard error", err);
      const errText = err.code ? err.code : err.message;
      updateConnectionStatus(`Connection Lost: ${errText}`, "#d9534f");
    });
  }

  async function submitGlobalScore(name, score) {
    if (!db || !currentUser) return;
    
    const collName = 'leaderboard';
    const path = useInternalAuth 
        ? collection(db, 'artifacts', appId, 'public', 'data', collName)
        : collection(db, 'scores');

    await addDoc(path, {
      name: name || "Anonymous",
      score: score,
      uid: currentUser.uid,
      timestamp: Date.now()
    });
  }

  function setupLocalLeaderboard() {
    const localData = localStorage.getItem('wordRunner_scores');
    let scores = localData ? JSON.parse(localData) : [];
    scores.sort((a, b) => b.score - a.score);
    renderLeaderboard(scores.slice(0, 10));
  }

  function submitLocalScore(name, score) {
    const localData = localStorage.getItem('wordRunner_scores');
    let scores = localData ? JSON.parse(localData) : [];
    scores.push({
      name: name || "Player",
      score: score,
      timestamp: Date.now()
    });
    localStorage.setItem('wordRunner_scores', JSON.stringify(scores));
    setupLocalLeaderboard();
  }

  function renderLeaderboard(scores) {
    const listEl = document.getElementById('scoresList');
    if (scores.length === 0) {
      listEl.innerHTML = "<div style='text-align:center; color:#999; padding:10px;'>No scores yet.</div>";
      return;
    }
    let html = "";
    scores.forEach((s, idx) => {
      const safeName = (s.name || "Anon").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      html += `
        <div class="score-row">
          <span class="rank">#${idx + 1}</span>
          <span class="pname">${safeName}</span>
          <span class="pscore">${s.score}</span>
        </div>`;
    });
    listEl.innerHTML = html;
  }

  async function handleScoreSubmit(name, score) {
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = "Saving...";

    try {
      if (isGlobalMode) {
        await submitGlobalScore(name, score);
      } else {
        submitLocalScore(name, score);
      }
      btn.textContent = "Saved!";
      document.getElementById('submitSection').style.display = 'none';
    } catch (e) {
      console.error("Save failed:", e);
      btn.textContent = "Error";
      btn.disabled = false;
      const errText = e.code ? e.code : e.message;
      updateConnectionStatus(`Save Failed: ${errText}`, "#d9534f");
    }
  }

  initSystem();

  // ==========================================
  //  GAME LOGIC
  // ==========================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const wordSpan = document.getElementById('word');
  const badgeShift = document.getElementById('badgeShift');
  const scoreSpan = document.getElementById('score');
  const statusEl = document.getElementById('status');
  const modalOverlay = document.getElementById('modalOverlay');
  const finalScoreSpan = document.getElementById('finalScore');
  const nameInput = document.getElementById('playerName');
  const btnSubmit = document.getElementById('btnSubmit');

  // --- ORIGINAL PHYSICS & DIMENSIONS RESTORED ---
  const GROUND_Y = 160;
  const RUNNER_X = 50;
  const RUNNER_W = 32;
  const RUNNER_H = 36;
  const GRAVITY = 0.3;
  const JUMP_VEL = -11;
  const BASE_SPEED = 2;

  const WORDS = [
    "run","jump","code","type","home","row","game","learn","fast",
    "space","shift","hello","world","press","track","skill","focus",
    "train","level","speed","tutor"
  ];

  let currentWord = { text: "", requireShift: false };
  let typed = "";
  let wordDone = false;
  let score = 0;
  let gameOver = false;
  let gameTick = 0; // Added for animation

  const runner = {
    x: RUNNER_X,
    y: GROUND_Y - RUNNER_H,
    vy: 0,
    onGround: true,
  };

  let obstacles = [];
  let spawnTimer = 0;
  let speed = BASE_SPEED;
  let clouds = []; // Added for visual bg

  const pressed = new Set();
  
  // Initialize Clouds
  for(let i=0; i<5; i++) {
    clouds.push({
      x: Math.random() * canvas.width,
      y: 20 + Math.random() * 80,
      s: 0.2 + Math.random() * 0.5
    });
  }

  function pickWordText() {
    return WORDS[Math.floor(Math.random() * WORDS.length)];
  }

  function makeNextWord() {
    const text = pickWordText();
    const requireShift = Math.random() < 0.3;
    return { text, requireShift };
  }

  function setNewWord() {
    currentWord = makeNextWord();
    typed = "";
    wordDone = false;
    renderWord();
    showStatus("");
  }

  function renderWord() {
    const txt = currentWord.text;
    const displayTxt = currentWord.requireShift ? txt.toUpperCase() : txt;
    let html = "";
    for (let i = 0; i < displayTxt.length; i++) {
      const chDisplay = displayTxt[i];
      if (i < typed.length) {
        html += `<span class="ok">${chDisplay}</span>`;
      } else {
        html += chDisplay;
      }
    }
    html += `<span class="cursor">▐</span>`;
    wordSpan.innerHTML = html;
    badgeShift.style.display = currentWord.requireShift ? "inline" : "none";
  }

  function showStatus(msg) {
    statusEl.textContent = msg;
  }

  // Original Logic
  function spawnObstacle() {
    const h = 30 + Math.floor(Math.random() * 25);
    obstacles.push({
      x: canvas.width + 20,
      y: GROUND_Y - h,
      w: 18,
      h: h
    });
  }

  function resetGame() {
    score = 0;
    scoreSpan.textContent = score;
    obstacles = [];
    runner.y = GROUND_Y - RUNNER_H;
    runner.vy = 0;
    runner.onGround = true;
    spawnTimer = 0;
    speed = BASE_SPEED;
    gameOver = false;
    gameTick = 0;
    
    // UI Reset
    modalOverlay.style.display = 'none';
    document.getElementById('submitSection').style.display = 'block';
    btnSubmit.textContent = "Submit Score";
    btnSubmit.disabled = false;

    setNewWord();
  }

  function rectsOverlap(x1,y1,w1,h1, x2,y2,w2,h2) {
    return x1 < x2 + w2 &&
           x1 + w1 > x2 &&
           y1 < y2 + h2 &&
           y1 + h1 > y2;
  }

  function handleGameOver() {
    gameOver = true;
    finalScoreSpan.textContent = score;
    modalOverlay.style.display = 'flex';
    nameInput.focus();
    if (!isGlobalMode) {
      setupLocalLeaderboard();
    }
  }

  function update() {
    if (!gameOver) {
      gameTick++; // Animate tick
      
      runner.vy += GRAVITY;
      runner.y += runner.vy;
      if (runner.y >= GROUND_Y - RUNNER_H) {
        runner.y = GROUND_Y - RUNNER_H;
        runner.vy = 0;
        runner.onGround = true;
      }

      spawnTimer -= 1;
      if (spawnTimer <= 0) {
        spawnObstacle();
        spawnTimer = 250 + Math.floor(Math.random() * 80);
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= speed;
        if (o.x + o.w < 0) {
          obstacles.splice(i, 1);
          score += 1;
          scoreSpan.textContent = score;
          speed = BASE_SPEED + Math.min(4, score * 0.05);
        }
      }

      for (const o of obstacles) {
        if (rectsOverlap(runner.x, runner.y, RUNNER_W, RUNNER_H, o.x, o.y, o.w, o.h)) {
          handleGameOver();
          break;
        }
      }
      
      // Update Clouds (purely visual)
      clouds.forEach(c => {
          c.x -= c.s;
          if(c.x < -100) c.x = canvas.width + 100;
      });
    }

    draw();
    requestAnimationFrame(update);
  }

  // ==========================================
  //  VISUALS ONLY (Logic Unchanged)
  // ==========================================
  function draw() {
    // Sky
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, "#bae6fd");
    grad.addColorStop(1, "#f0f9ff");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Clouds
    ctx.fillStyle = "rgba(255, 255, 255, 0.6)";
    clouds.forEach(c => drawCloud(ctx, c.x, c.y, 40));

    // Distant Hills
    ctx.fillStyle = "#a5f3fc"; 
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    for(let i=0; i<=canvas.width; i+=50) {
        ctx.lineTo(i, GROUND_Y - 20 - Math.sin(i * 0.01 + gameTick * 0.002) * 20);
    }
    ctx.lineTo(canvas.width, GROUND_Y);
    ctx.fill();

    // Ground
    ctx.fillStyle = "#475569"; 
    ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
    ctx.fillStyle = "#16a34a";
    ctx.fillRect(0, GROUND_Y, canvas.width, 6);

    // Runner Sprite
    drawHumanRunner(ctx, runner.x, runner.y, RUNNER_W, RUNNER_H, !runner.onGround, gameTick);

    // Obstacle Sprites
    for (const o of obstacles) {
      drawCrate(ctx, o.x, o.y, o.w, o.h);
    }
  }

  function drawCloud(ctx, x, y, size) {
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.arc(x + size*0.7, y - size*0.4, size*0.8, 0, Math.PI * 2);
      ctx.arc(x + size*1.5, y, size*0.9, 0, Math.PI * 2);
      ctx.fill();
  }

  // Upgraded Human Runner: Jointed, Shirt, Tapered
  function drawHumanRunner(ctx, x, y, w, h, isJumping, tick) {
      const cx = x + w/2;
      const cy = y + h/2;
      
      // Animation State
      // Reduced speed multiplier for legs (was 0.3)
      const runCycle = tick * 0.15;
      // Fixed pose if jumping
      const currentCycle = isJumping ? Math.PI / 4 : runCycle;
      
      // Angles for limbs (Sin/Cos for pendulum motion)
      // Left arm/right leg synced; Right arm/left leg synced
      const lArmAngle = Math.cos(currentCycle) * 0.8;
      const rArmAngle = Math.cos(currentCycle + Math.PI) * 0.8;
      const lLegAngle = Math.sin(currentCycle) * 0.6;
      const rLegAngle = Math.sin(currentCycle + Math.PI) * 0.6;

      // Colors
      const cSkin = "#fcd34d";
      const cShirt = "#ef4444"; // Red shirt
      const cPants = "#1e293b";
      
      ctx.save();
      // Pivot around center of bounding box
      ctx.translate(cx, y + h/2);
      
      // Tilt body slightly forward
      ctx.rotate(0.1); 

      // --- Draw Left Limbs (Background) ---
      
      // Left Leg (Behind)
      ctx.strokeStyle = cPants;
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 5); // Hip
      // Knee
      const lKneeX = Math.sin(lLegAngle) * 12;
      const lKneeY = 18 + Math.cos(lLegAngle) * 5;
      ctx.lineTo(lKneeX, lKneeY);
      // Foot (Shin) - bend slightly back if lifting
      const lFootAngle = lLegAngle - 0.3; 
      ctx.lineTo(lKneeX + Math.sin(lFootAngle) * 12, lKneeY + 12);
      ctx.stroke();

      // Left Arm (Behind)
      ctx.strokeStyle = cSkin;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, -10); // Shoulder
      // Hand
      ctx.lineTo(Math.sin(lArmAngle) * 14, 5 + Math.cos(lArmAngle) * 5);
      ctx.stroke();

      // --- Body ---
      // Torso
      ctx.fillStyle = cShirt;
      ctx.beginPath();
      // Draw oval/egg shape for torso
      ctx.ellipse(0, 0, 9, 15, 0, 0, Math.PI * 2);
      ctx.fill();
      
      // Head
      ctx.fillStyle = cSkin;
      ctx.beginPath();
      ctx.arc(2, -20, 8, 0, Math.PI * 2);
      ctx.fill();
      
      // Hair
      ctx.fillStyle = "#333";
      ctx.beginPath();
      // Simple hair cap
      ctx.arc(2, -22, 8, Math.PI, Math.PI*2.5);
      ctx.fill();
      
      // Eye (Facing right)
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(6, -21, 1.5, 0, Math.PI*2);
      ctx.fill();

      // --- Draw Right Limbs (Foreground) ---
      
      // Right Leg (Front)
      ctx.strokeStyle = cPants;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(0, 5); // Hip
      const rKneeX = Math.sin(rLegAngle) * 12;
      const rKneeY = 18 + Math.cos(rLegAngle) * 5;
      ctx.lineTo(rKneeX, rKneeY);
      const rFootAngle = rLegAngle - 0.3;
      ctx.lineTo(rKneeX + Math.sin(rFootAngle) * 12, rKneeY + 12);
      ctx.stroke();

      // Right Arm (Front)
      ctx.strokeStyle = cSkin;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, -10); // Shoulder
      ctx.lineTo(Math.sin(rArmAngle) * 14, 5 + Math.cos(rArmAngle) * 5);
      ctx.stroke();
      
      // Sleeve
      ctx.strokeStyle = cShirt;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, -10);
      ctx.lineTo(Math.sin(rArmAngle) * 6, -6 + Math.cos(rArmAngle) * 3);
      ctx.stroke();

      ctx.restore();
  }

  function drawCrate(ctx, x, y, w, h) {
      ctx.fillStyle = "#b45309"; 
      ctx.fillRect(x, y, w, h);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#78350f"; 
      ctx.strokeRect(x, y, w, h);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + w, y + h);
      ctx.stroke();
  }

  function doJump() {
    if (runner.onGround) {
      runner.vy = JUMP_VEL;
      runner.onGround = false;
    }
  }
  
  btnSubmit.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if(name) {
      handleScoreSubmit(name, score);
    }
  });

  window.addEventListener("keydown", function(e) {
    if (gameOver && e.target === nameInput) {
      if (e.key === "Enter") {
        btnSubmit.click();
      }
      return;
    }

    pressed.add(e.code);
    if ((e.key === "r" || e.key === "R") && gameOver) {
      resetGame();
      return;
    }
    if (gameOver) return;

    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (wordDone) {
        doJump();
        setNewWord();
      } else {
        showStatus("Finish the word first.");
      }
      return;
    }

    if (e.key.length !== 1) return;
    if (wordDone) return;

    const keyLower = e.key.toLowerCase();
    const expected = currentWord.text[typed.length];
    const shiftHeld = pressed.has("ShiftLeft") || pressed.has("ShiftRight");

    if (currentWord.requireShift) {
      if (!shiftHeld) {
        showStatus("Hold Shift while typing this word.");
        return;
      }
    } else {
      if (shiftHeld) {
        showStatus("Do NOT hold Shift for this word.");
        return;
      }
    }

    if (keyLower === expected) {
      typed += keyLower;
      renderWord();

      if (typed.length === currentWord.text.length) {
        wordDone = true;
        showStatus("Ready — press Space/Enter to jump.");
      }
    }
  });

  window.addEventListener("keyup", function(e) {
    pressed.delete(e.code);
  });

  resetGame();
  requestAnimationFrame(update);
</script>
</body>
