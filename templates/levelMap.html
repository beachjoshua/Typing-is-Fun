<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>">
  <title>Select Level</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Backgrounds */
      --sky-top: #6dd5ed;
      --sky-bottom: #2193b0;
      --path-color: rgba(255, 255, 255, 0.5);
      
      /* Level Colors */
      --locked-bg: #dfe6e9;
      --locked-shadow: #b2bec3;
      --active-bg: #ff9ff3;
      --active-shadow: #f368e0;
      --done-bg: #55efc4;
      --done-shadow: #00b894;

      /* UI Colors */
      --ui-blue: #0984e3;
      --ui-blue-dark: #0769b5;
    }

    body {
      background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
      font-family: 'Nunito', sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    /* --- Background Clouds --- */
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      z-index: 0;
    }
    .c1 { width: 120px; height: 40px; top: 10%; left: 10%; }
    .c2 { width: 200px; height: 60px; top: 30%; right: 15%; }
    .c3 { width: 150px; height: 50px; top: 70%; left: 20%; }

    /* --- Header --- */
    header {
      margin-top: 40px;
      margin-bottom: 60px;
      z-index: 10;
      text-align: center;
    }

    h1 {
      color: white;
      font-size: 3.5rem;
      font-weight: 900;
      margin: 0 0 20px 0;
      text-shadow: 0 4px 0 var(--ui-blue-dark), 0 8px 5px rgba(0,0,0,0.2);
      letter-spacing: 1px;
    }

    /* --- Home Button --- */
    .btn-home {
      display: inline-block;
      text-decoration: none;
      color: white;
      background: var(--ui-blue);
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: 800;
      border-bottom: 4px solid var(--ui-blue-dark); 
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s ease;
    }

    /* Hover */
    .btn-home:hover { 
      transform: translateY(-2px); 
      filter: brightness(1.1); 
    }

    /* Active */
    .btn-home:active { 
      transform: translateY(2px); 
      border-bottom-width: 4px; /* Keep border constant to prevent layout shifts */
      box-shadow: 0 0 0 rgba(0,0,0,0); /* Remove shadow to look pressed */
    }

    /* --- Map Container --- */
    .map-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 80px;
      z-index: 10;
      padding-bottom: 60px;
    }

    .path-line {
      position: absolute;
      top: 40px;
      bottom: 60px;
      width: 0;
      border-left: 8px dashed var(--path-color);
      z-index: -1;
      left: 50%;
      transform: translateX(-4px);
    }

    /* --- Level Nodes --- */
    .level-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      color: white;
      text-decoration: none;
      position: relative;
      
      border: none;
      border-bottom: 6px solid; 
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      text-shadow: 0 2px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s ease-out, filter 0.1s;
    }

    /* --- Hover Effects --- */
    .level-btn:not(.locked):hover {
      transform: scale(1.15) translateY(-5px); 
      filter: brightness(1.15); 
      z-index: 100;
      cursor: pointer;
    }

    /* --- States --- */
    .level-btn.locked {
      background-color: var(--locked-bg);
      border-bottom-color: var(--locked-shadow);
      color: #95a5a6;
      cursor: default;
      box-shadow: none;
      text-shadow: none;
    }
    
    .level-btn.unlocked {
      background-color: var(--active-bg);
      border-bottom-color: var(--active-shadow);
      animation: float 2s ease-in-out infinite;
      z-index: 2;
      font-size: 2.5rem;
    }
    
    .level-btn.unlocked:hover {
      animation: none;
    }
    
    .level-btn.unlocked:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    .level-btn.completed {
      background-color: var(--done-bg);
      border-bottom-color: var(--done-shadow);
    }
    .level-btn.completed:active {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    /* --- Labels (Cards) --- */
    .level-card {
      position: absolute;
      background: white;
      padding: 12px 24px;
      border-radius: 20px;
      font-size: 1rem;
      color: #2d3436;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      pointer-events: none;
      left: 110px;
      opacity: 0;
      transform: translateX(-10px) scale(0.9);
      transition: all 0.15s ease-out;
    }
    
    .level-card::before {
        content: '';
        position: absolute;
        left: -10px;
        top: 50%;
        transform: translateY(-50%);
        border-style: solid;
        border-width: 10px 10px 10px 0;
        border-color: transparent white transparent transparent;
    }

    .level-btn:hover .level-card,
    .level-btn.unlocked .level-card {
      opacity: 1;
      transform: translateX(0) scale(1);
    }

    /* Alternating Layout */
    .level-wrapper:nth-child(even) { transform: translateX(-70px); }
    .level-wrapper:nth-child(odd) { transform: translateX(70px); }

    .level-wrapper:nth-child(odd) .level-card {
      left: auto; right: 110px;
    }
    .level-wrapper:nth-child(odd) .level-card::before {
        left: auto; right: -10px;
        border-width: 10px 0 10px 10px;
        border-color: transparent transparent transparent white;
    }

    .level-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Reset Button */
    .reset-btn {
      margin-top: 30px;
      background: #2d3436;
      border: none;
      border-bottom: 4px solid black;
      color: white;
      padding: 12px 30px;
      border-radius: 30px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .reset-btn:hover { transform: translateY(2px); border-bottom-width: 2px; background: #4a5568; }
    .reset-btn:active { transform: translateY(4px); border-bottom-width: 0px; }

  </style>
</head>
<body>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <header>
    <h1>World Map</h1>
    <a href="/" class="btn-home">Back to Home Menu</a>
  </header>

  <div class="map-container" id="mapContainer">
    <div class="path-line"></div>
  </div>

  <button class="reset-btn" onclick="resetProgress()">Reset ALL Progress</button>

  <script>
    const levels = [
      { name: "Index Fingers" },
      { name: "Middle Fingers" },
      { name: "Ring Fingers" },
      { name: "Pinky Fingers" },
      { name: "Home Row Mix" }
    ];

    let maxLevel = parseInt(localStorage.getItem('typingFun_maxLevel') || 0);
    const mapContainer = document.getElementById('mapContainer');

    levels.forEach((lvl, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'level-wrapper';

      const btn = document.createElement('a');
      btn.className = 'level-btn';
      
      const label = document.createElement('div');
      label.className = 'level-card';
      label.textContent = `${index + 1}. ${lvl.name}`;

      if (index < maxLevel) {
        btn.classList.add('completed');
        btn.href = `/testLesson?level=${index}`;
        btn.innerHTML = "✔"; 
      } else if (index === maxLevel) {
        btn.classList.add('unlocked');
        btn.href = `/testLesson?level=${index}`;
        btn.innerHTML = "★"; 
      } else {
        btn.classList.add('locked');
        btn.innerHTML = "🔒"; 
      }

      btn.appendChild(label);
      wrapper.appendChild(btn);
      mapContainer.appendChild(wrapper);
    });

    function resetProgress() {
      if(confirm("Are you sure you want to reset your progress?")) {
        localStorage.setItem('typingFun_maxLevel', 0);
        location.reload();
      }
    }
  </script>
</body>
</html>
